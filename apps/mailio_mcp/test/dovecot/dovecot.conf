# Minimal Dovecot for the mailio_mcp IMAP tests: one user, Maildir on tmpfs,
# plain IMAP with STARTTLS on 143 and implicit TLS on 993. CONDSTORE and
# QRESYNC are on by default.
protocols = imap
listen = *
log_path = /dev/stderr
info_log_path = /dev/stderr
mail_location = maildir:/srv/mail/%u/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 1000
disable_plaintext_auth = no
auth_mechanisms = plain login
passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/users
}
userdb {
  driver = static
  args = uid=vmail gid=vmail home=/srv/mail/%u
}
ssl = yes
ssl_cert = </certs/mailpit.pem
ssl_key = </certs/mailpit.key
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
namespace inbox {
  inbox = yes
  separator = /
}
