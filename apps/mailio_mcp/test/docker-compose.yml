# Disposable mail server for the end-to-end tests.
# IMAP 3143/3993 (TLS), POP3 3110/3995 (TLS), SMTP 3025/3465 (TLS).
services:
  greenmail:
    image: greenmail/standalone:2.1.3
    ports:
      - "3025:3025"
      - "3110:3110"
      - "3143:3143"
      - "3465:3465"
      - "3993:3993"
      - "3995:3995"
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=alice:secret@example.test,support:secret@example.test,bob:secret@example.test,carol:secret@example.test
        -Dgreenmail.verbose
