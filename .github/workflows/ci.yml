name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Format, lint, xref, Dialyzer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: 'nightly'

      - uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: ${{ runner.os }}-checks-${{ hashFiles('apps/*/rebar.config', 'rebar.config') }}
          restore-keys: ${{ runner.os }}-checks-

      - run: rebar3 fmt --check
      - run: rebar3 compile
      - run: rebar3 lint
      - run: rebar3 xref

      # mailio must not depend on the store or the MCP server, and mailio_mcp
      # must not depend on mailio_store or barrel_docdb (see docs/architecture.md).
      - name: Dependency rule
        run: |
          if grep -E "mailio_store|mailio_mcp|barrel_docdb|barrel_mcp" apps/mailio/src/mailio.app.src; then
            echo "mailio must not depend on the store or the MCP server"; exit 1
          fi
          if grep -E "mailio_store|barrel_docdb" apps/mailio_mcp/src/mailio_mcp.app.src; then
            echo "mailio_mcp must not depend on mailio_store or barrel_docdb"; exit 1
          fi

      # Four warnings in old code are accepted. A fifth fails the build.
      - name: Dialyzer (at most 4 known warnings)
        run: |
          set +e
          rebar3 dialyzer 2>&1 | tee dialyzer.out
          N=$(sed -n 's/.*Warnings occurred running dialyzer: \([0-9]*\).*/\1/p' dialyzer.out | tail -1)
          N=${N:-0}
          echo "dialyzer warnings: $N"
          [ "$N" -le 4 ]

  tests:
    name: Unit and component tests, OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        otp: ['28', '29']
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: 'nightly'

      - uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: ${{ runner.os }}-otp-${{ matrix.otp }}-${{ hashFiles('apps/*/rebar.config', 'rebar.config') }}
          restore-keys: ${{ runner.os }}-otp-${{ matrix.otp }}-

      - run: rebar3 eunit

      # Suites that need a real mail server skip themselves when it is absent;
      # the interop job below runs them against real servers.
      - run: rebar3 ct --dir apps/mailio/test
      - run: rebar3 ct --dir apps/mailio_store/test

  interop:
    name: Real servers (Dovecot, GreenMail, Mailpit, Stalwart)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: 'nightly'

      - uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: ${{ runner.os }}-interop-${{ hashFiles('apps/*/rebar.config', 'rebar.config') }}
          restore-keys: ${{ runner.os }}-interop-

      # the stdio test starts bin/mailio-mcp, which loads the default build
      - run: rebar3 compile

      - name: Test certificates
        run: apps/mailio/test/mailpit/gen-certs.sh

      - name: Start the servers
        run: |
          (cd apps/mailio_mcp/test/dovecot && docker compose up -d --build)
          (cd apps/mailio_mcp/test && docker compose up -d)
          (cd apps/mailio/test/mailpit && docker compose up -d)
          apps/mailio/test/stalwart/setup.sh

      - name: Wait for GreenMail and Dovecot
        run: |
          for port in 3143 3110 3025 31143 31110; do
            for i in $(seq 1 90); do
              nc -z 127.0.0.1 $port && break
              sleep 1
            done
          done

      - name: Library against real servers
        run: |
          rebar3 ct --suite apps/mailio/test/mailio_interop_SUITE
          rebar3 ct --suite apps/mailio/test/mailio_smtp_mailpit_SUITE

      - name: MCP server end to end
        run: |
          rebar3 ct --suite apps/mailio_mcp/test/mailio_mcp_e2e_SUITE
          rebar3 ct --suite apps/mailio_mcp/test/mailio_mcp_imap_dovecot_SUITE

      - name: Server logs on failure
        if: failure()
        run: |
          docker ps -a
          for c in $(docker ps -aq); do echo "== $c"; docker logs --tail 40 $c 2>&1; done

  package:
    name: Hex package and docs for mailio
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: 'nightly'

      - name: Build the package and its docs
        working-directory: apps/mailio
        run: rebar3 hex build

      - name: The package holds the license and no other app
        working-directory: apps/mailio
        run: |
          mkdir /tmp/pkg && tar -xf _build/default/lib/mailio/hex/mailio-*[0-9].tar -C /tmp/pkg
          tar -tzf /tmp/pkg/contents.tar.gz | grep -x LICENSE
          tar -tzf /tmp/pkg/contents.tar.gz | grep -x README.md
          mkdir /tmp/docs && tar -xf _build/default/lib/mailio/hex/mailio-*-docs.tar -C /tmp/docs
          test -f /tmp/docs/readme.html && test -f /tmp/docs/overview.html && test -f /tmp/docs/usage.html
          if tar -tzf /tmp/pkg/contents.tar.gz | grep -E "mailio_(store|mcp)"; then
            echo "the package holds another app"; exit 1
          fi
